<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <header class="hud">
      <h1>Snake</h1>
      <div class="scores">
        <div>Score <span id="score">0</span></div>
        <div>Best <span id="best">0</span></div>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">Snake</h2>
        <p id="overlay-text">Press <kbd>Space</kbd> or tap Start</p>
        <button id="start-btn" type="button">Start</button>
      </div>
    </div>

    <div class="controls" aria-label="Touch controls">
      <button data-dir="up" type="button" aria-label="Up">▲</button>
      <button data-dir="left" type="button" aria-label="Left">◀</button>
      <button data-dir="down" type="button" aria-label="Down">▼</button>
      <button data-dir="right" type="button" aria-label="Right">▶</button>
    </div>

    <p class="help">Arrow keys / WASD to move · Space to pause</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
